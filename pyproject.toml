[project]
name = "codogram"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.4",
    "aiofiles>=23.0",
    "openai>=1.0",
    "Pillow>=10.0.0",
    "pydantic-settings>=2.0",
    "telegramify-markdown>=0.5",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "freezegun>=1.2"]
